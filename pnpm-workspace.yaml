packages:
  # all packages in subdirectories of packages/ and components/
  - packages/*
  # exclude packages that are inside test directories
  - '!**/test/**'

shamefullyHoist: true

overrides:
  axios: '>=1.18.1'
  brace-expansion@<2.0.0: '1.1.11'
  dns-packet: '>=5.6.1'
  hoek: 'npm:@hapi/hoek@>=10.0.0'
  ip: '>=2.0.1'
  minimist: '>=1.2.6'
  qs: '>=6.15.3'
  tough-cookie: '>=4.1.3 <5.0.0'

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
    - ia32

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
